<!DOCTYPE html>
<html>
<head>
    <title>Customer Profile Search</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 16px; background: #f5f5f5; }
        .search-container { background: white; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: 600; margin-bottom: 4px; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background: #0073bb; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #005a94; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .profile-card { padding: 16px; border: 1px solid #eee; background: white; margin-top: 8px; border-radius: 4px; }
        .profile-name { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .assoc-btn { background: #037f0c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 8px; }
        #status { margin-top: 12px; font-size: 13px; }
        .error { color: #d91515; }
        .success { color: #037f0c; }
        .hint { font-size: 11px; color: #687078; margin-top: 2px; }
    </style>
</head>
<body>
    <div class="search-container">
        <h2>Search Customer Profiles</h2>
        <form id="searchForm">
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="phone" placeholder="+18001234567">
                <div class="hint">Partial or full number</div>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="customer@example.com">
            </div>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="fullName" placeholder="e.g. Jane Doe">
                <div class="hint">Enter full name (first and last) for name-based search</div>
            </div>
            <button type="submit" class="btn" id="searchBtn">Search Profiles</button>
        </form>
        <div id="status"></div>
    </div>
    <div id="results"></div>

    <script src="connect-sdk-app.bundle.js"></script>
    <script>
        // API calls go through CloudFront proxy (same domain, no CSP issues, key injected server-side)
        const API_ENDPOINT = '/prod/search';

        let currentContactId = null;
        let agentId = null;

        // Initialize App SDK for third-party app integration
        try {
            var initResult = AmazonConnectSDK.AmazonConnectApp.init({
                onCreate: function(event) {
                    try {
                        if (event && event.contactId) currentContactId = event.contactId;
                        if (event && event.context && event.context.contactId)
                            currentContactId = event.context.contactId;
                        if (event && event.context && event.context.agentId)
                            agentId = event.context.agentId;
                        if (!agentId && event && event.context && event.context.agentArn) {
                            var parts = event.context.agentArn.split('/');
                            agentId = parts[parts.length - 1];
                        }
                    } catch(e) {}
                },
                onDestroy: function(event) {}
            });
            try {
                var contactClient = new AmazonConnectSDK.ContactClient(initResult.provider);
                contactClient.onConnected(function(event) {
                    try { currentContactId = event.contactId; } catch(e) {}
                });
                contactClient.onIncoming(function(event) {
                    try { currentContactId = event.contactId; } catch(e) {}
                });
            } catch(e) {}
        } catch (e) {
            // Fallback: intercept postMessage from workspace to get contactId and agentId
            window.addEventListener('message', function(event) {
                try {
                    var data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                    if (!currentContactId) {
                        var id = (data && data.contactId) ||
                                 (data && data.data && data.data.contactId) ||
                                 (data && data.payload && data.payload.contactId) ||
                                 (data && data.context && data.context.contactId);
                        if (id) currentContactId = id;
                    }
                    if (!agentId) {
                        var aid = (data && data.agentId) ||
                                  (data && data.context && data.context.agentId);
                        if (aid) agentId = aid;
                    }
                } catch(e) {}
            });
        }

        const status = (msg, cls) => {
            document.getElementById('status').textContent = msg;
            document.getElementById('status').className = cls || '';
        };

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const params = {};
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const fullName = document.getElementById('fullName').value.trim();
            if (phone) params.phone = phone;
            if (email) params.email = email;
            if (fullName) params.fullName = fullName;

            if (!Object.keys(params).length) {
                status('Enter at least one search criterion', 'error');
                return;
            }

            document.getElementById('searchBtn').disabled = true;
            status('Searching...');
            try {
                const res = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Search failed');
                displayResults(data.profiles || []);
                status(
                    data.profiles && data.profiles.length
                        ? data.profiles.length + ' result(s) found'
                        : 'No results found',
                    data.profiles && data.profiles.length ? 'success' : ''
                );
            } catch (err) {
                status(err.message, 'error');
            } finally {
                document.getElementById('searchBtn').disabled = false;
            }
        });

        function displayResults(profiles) {
            if (!profiles.length) { document.getElementById('results').innerHTML = ''; return; }
            const html = profiles.map(p => {
                const name = ((p.FirstName || '') + ' ' + (p.LastName || '')).trim();
                return `
                <div class="profile-card">
                    <div class="profile-name">${esc(name || '-')}</div>
                    <div>Phone: ${esc(p.PhoneNumber || '-')}</div>
                    <div>Email: ${esc(p.EmailAddress || '-')}</div>
                    <button class="assoc-btn" onclick="associateProfile('${esc(p.ProfileId)}','${esc(p.PhoneNumber || '')}','${esc(p.EmailAddress || '')}','${esc(name)}')">Associate with Contact</button>
                </div>`;
            }).join('');
            document.getElementById('results').innerHTML = html;
        }

        const associatedProfiles = new Set();

        async function associateProfile(profileId, currentPhone, currentEmail, currentName) {
            if (associatedProfiles.has(profileId)) {
                status('Already associated with this contact', 'error');
                return;
            }
            status('Associating...');
            try {
                const payload = { associate: true, id: profileId };

                // Pass agentId if captured from App SDK
                if (agentId) payload.agentId = agentId;

                // Pass contactId if captured from App SDK lifecycle
                if (currentContactId) payload.contactId = currentContactId;

                const phone = document.getElementById('phone').value.trim();
                const email = document.getElementById('email').value.trim();
                const fullName = document.getElementById('fullName').value.trim();

                // Detect field changes for profile update
                const normPhone = phone.replace(/[\s\-\+]/g, '');
                const normCurrentPhone = currentPhone.replace(/[\s\-\+]/g, '');
                if (phone && normPhone !== normCurrentPhone) payload.updatePhone = phone;
                if (email && email !== currentEmail) payload.updateEmail = email;
                if (fullName && fullName.toLowerCase() !== currentName.toLowerCase())
                    payload.updateName = fullName;

                const res = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.status === 409) {
                    status(data.message, 'error');
                    return;
                }
                if (!res.ok) throw new Error(data.message || 'Association failed');

                associatedProfiles.add(profileId);
                status(data.message || 'Profile associated', 'success');
            } catch (err) {
                status(err.message, 'error');
            }
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }
    </script>
</body>
</html>
